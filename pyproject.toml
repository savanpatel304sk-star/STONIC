[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonic-assistant"
version = "0.1.0"
description = "A safety-first STONIC assistant interface and local Python service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
stonic = "bootstrap:main"

[tool.setuptools]
py-modules = ["bootstrap", "config", "launcher", "main", "startup"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "data*", "intelligence*", "integrations*", "logging_system*", "memory*", "micro_agents*", "orchestration*", "safety*", "services*", "tools*", "vision*", "voice*"]
